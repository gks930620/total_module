<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 링크 미리보기 대표 이미지 원본(1200x630). 명함 사진이 없는 명함을 카톡 등에 공유할 때 쓰인다.
       메신저마다 가운데를 정사각형으로 잘라 보여주기도 해서, 그림과 글자는 가운데 630x630 안에 둔다.
       명함 그림은 public/icons/favicon.svg 와 같다. 글자는 시스템 글꼴로 그려진다(렌더링한 PC 기준). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1640" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(600 250) scale(1.25) translate(-256 -256)">
    <rect x="88" y="150" width="336" height="212" rx="28" fill="#ffffff" filter="url(#lift)"/>
    <rect x="124" y="206" width="120" height="22" rx="11" fill="#6d5efc"/>
    <rect x="124" y="244" width="88" height="16" rx="8" fill="#c4b8fd"/>
    <rect x="124" y="290" width="104" height="16" rx="8" fill="#c4b8fd"/>
    <g fill="#2b2745">
      <rect x="280" y="200" width="48" height="48" rx="8"/>
      <rect x="344" y="200" width="48" height="48" rx="8"/>
      <rect x="280" y="264" width="48" height="48" rx="8"/>
    </g>
    <g fill="#ffffff">
      <rect x="292" y="212" width="24" height="24" rx="4"/>
      <rect x="356" y="212" width="24" height="24" rx="4"/>
      <rect x="292" y="276" width="24" height="24" rx="4"/>
    </g>
    <g fill="#2b2745">
      <rect x="298" y="218" width="12" height="12" rx="2"/>
      <rect x="362" y="218" width="12" height="12" rx="2"/>
      <rect x="298" y="282" width="12" height="12" rx="2"/>
      <rect x="344" y="264" width="12" height="12" rx="2"/>
      <rect x="380" y="264" width="12" height="12" rx="2"/>
      <rect x="362" y="282" width="12" height="12" rx="2"/>
      <rect x="344" y="300" width="12" height="12" rx="2"/>
      <rect x="380" y="300" width="12" height="12" rx="2"/>
    </g>
  </g>
  <text x="600" y="505" text-anchor="middle" fill="#ffffff"
        font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="64" font-weight="800">명함QR</text>
  <text x="600" y="560" text-anchor="middle" fill="#ffffff" fill-opacity="0.85"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="600" letter-spacing="1">Businesscard QR</text>
</svg>
