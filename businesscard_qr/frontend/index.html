<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>명함QR</title>
    <meta name="description" content="QR코드와 링크로 명함을 공유하세요 · Share your business card with a QR code" />

    <!-- 주소창·상태바 색 — 디자인 킷 Halo 의 --point / --bg(dark) 와 같은 값 -->
    <meta name="theme-color" content="#6d5efc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14121f" media="(prefers-color-scheme: dark)" />

    <!-- PWA. 이름은 언어를 따라야 해서(명함QR / Businesscard QR) 서버가 만들어 준다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="명함QR" />

    <!-- 디자인 킷. 개인정보처리방침 같은 정적 문서와 같은 파일을 쓴다(킷 교체 = 이 파일 교체) -->
    <link rel="stylesheet" href="/design-kit/design-kit.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 인라인 스크립트를 쓰지 않는다 — CSP script-src 'self' (SecurityConfig.CSP) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
