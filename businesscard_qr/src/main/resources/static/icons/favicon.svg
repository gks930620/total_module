<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 명함QR 아이콘. 원본은 이 파일 하나이고 PNG 는 scripts/render-icons.mjs 로 여기서 뽑는다.
       색은 디자인 킷 Halo 의 card-accent(#6d5efc→#a78bfa), text(#2b2745) 토큰과 같다.
       주의: XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다(쓰면 파일 전체가 깨진다). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="glyph">
    <!-- 명함 -->
    <rect x="88" y="150" width="336" height="212" rx="28" fill="#ffffff"/>
    <!-- 이름·직함 줄 -->
    <rect x="124" y="206" width="120" height="22" rx="11" fill="#6d5efc"/>
    <rect x="124" y="244" width="88" height="16" rx="8" fill="#c4b8fd"/>
    <rect x="124" y="290" width="104" height="16" rx="8" fill="#c4b8fd"/>
    <!-- QR: 파인더 패턴 세 개 + 데이터 점 -->
    <g fill="#2b2745">
      <rect x="280" y="200" width="48" height="48" rx="8"/>
      <rect x="344" y="200" width="48" height="48" rx="8"/>
      <rect x="280" y="264" width="48" height="48" rx="8"/>
    </g>
    <g fill="#ffffff">
      <rect x="292" y="212" width="24" height="24" rx="4"/>
      <rect x="356" y="212" width="24" height="24" rx="4"/>
      <rect x="292" y="276" width="24" height="24" rx="4"/>
    </g>
    <g fill="#2b2745">
      <rect x="298" y="218" width="12" height="12" rx="2"/>
      <rect x="362" y="218" width="12" height="12" rx="2"/>
      <rect x="298" y="282" width="12" height="12" rx="2"/>
      <rect x="344" y="264" width="12" height="12" rx="2"/>
      <rect x="380" y="264" width="12" height="12" rx="2"/>
      <rect x="362" y="282" width="12" height="12" rx="2"/>
      <rect x="344" y="300" width="12" height="12" rx="2"/>
      <rect x="380" y="300" width="12" height="12" rx="2"/>
    </g>
  </g>
</svg>
