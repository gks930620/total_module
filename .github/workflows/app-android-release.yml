# businesscard_qr 앱 — Google Play 업로드용 AAB 빌드
#
# 실행 방법: Actions 탭에서 "Run workflow" (수동). 태그를 밀면 자동으로도 돈다.
# 산출물: app-release.aab (Actions 아티팩트). Play Console 에 올린다.
#
# 필요한 GitHub Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   릴리스 keystore(.jks)를 base64 로 인코딩한 문자열
#                             만들기: base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD keystore 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭 (예: upload)
#   ANDROID_KEY_PASSWORD      키 비밀번호
#   APP_ENV_FILE              앱 .env 파일 전체 내용 (BACKEND_BASE_URL, KAKAO_NATIVE_APP_KEY)
#
# ⚠️ 릴리스 keystore 를 잃어버리면 같은 앱을 다시 올릴 수 없다. 반드시 따로 백업할 것.
name: App · Android release (AAB)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode (Play 는 올릴 때마다 커져야 한다)"
        required: true
        default: "1"
      build_name:
        description: "versionName (예: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "app-v*"

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: businesscard_qr_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      # .env 는 저장소에 없다(gitignore). 에셋으로 번들되므로 빌드 전에 만들어야 한다.
      - name: Write .env
        run: printf '%s\n' "${{ secrets.APP_ENV_FILE }}" > .env

      # 릴리스 서명 키 — android/app/build.gradle.kts 가 android/key.properties 를 읽는다.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --build-name="${{ inputs.build_name || '1.0.0' }}" \
            --build-number="${{ inputs.build_number || github.run_number }}"

      # 서명이 실제로 릴리스 키로 됐는지 확인 — 디버그 키로 서명되면 Play 가 거부한다.
      - name: Verify signing
        run: |
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          unzip -p "$BUNDLE" META-INF/*.RSA 2>/dev/null | keytool -printcert | head -20 \
            || echo "서명 정보를 읽지 못했다 — Play 업로드 시 확인할 것"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: businesscard_qr_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # 서명 재료는 러너에 남기지 않는다.
      - name: Clean secrets
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties .env
