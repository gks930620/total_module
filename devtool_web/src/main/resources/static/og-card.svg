<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="개발자 유틸 모음 — 업로드 없는 웹 도구 45종">
  <!--
    링크를 붙였을 때(카톡·슬랙·트위터) 보이는 카드.
    시안 J 원칙 그대로: 읽는 면은 불투명, 초점에만 그라디언트.
    SVG 로 둔 이유는 이 사이트가 외부 자산을 하나도 안 쓰기 때문이다 — 빌드에 그림 도구가 필요 없다.
  -->
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5efc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d5efc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#f8f7fd"/>
  <rect x="72" y="72" width="1056" height="486" rx="32" fill="#ffffff"/>
  <rect x="72" y="72" width="1056" height="4" rx="2" fill="url(#edge)"/>

  <rect x="128" y="150" width="76" height="76" rx="22" fill="url(#halo)"/>
  <path d="M150 196 l14 -14 M164 182 l10 10 M174 192 l-14 14" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="228" y="205" font-family="Pretendard, 'Malgun Gothic', system-ui, sans-serif"
        font-size="42" font-weight="700" fill="#2b2745">개발자 유틸 모음</text>

  <text x="128" y="320" font-family="Pretendard, 'Malgun Gothic', system-ui, sans-serif"
        font-size="64" font-weight="800" fill="#2b2745">업로드 없는 웹 도구 45종</text>

  <text x="128" y="392" font-family="Pretendard, 'Malgun Gothic', system-ui, sans-serif"
        font-size="30" fill="#63608a">JSON · JWT · 정규식 · 글자수 · 이미지 · PDF · 계산기</text>

  <g font-family="Pretendard, 'Malgun Gothic', system-ui, sans-serif" font-size="26" font-weight="600">
    <rect x="128" y="440" width="196" height="56" rx="28" fill="#eeecff"/>
    <text x="226" y="476" fill="#5a49f0" text-anchor="middle">광고 없음</text>

    <rect x="344" y="440" width="256" height="56" rx="28" fill="#eeecff"/>
    <text x="472" y="476" fill="#5a49f0" text-anchor="middle">서버 전송 없음</text>

    <rect x="620" y="440" width="212" height="56" rx="28" fill="#eeecff"/>
    <text x="726" y="476" fill="#5a49f0" text-anchor="middle">가입 없음</text>
  </g>
</svg>
